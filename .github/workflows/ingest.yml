name: Ingest news

on:
  schedule:
    # Every 3h across the Indian daytime window (skip 01–06 IST when Indian
    # newsrooms are dead). 6 runs/day at 07/10/13/16/19/22 IST.
    #   01:30 UTC = 07:00 IST
    #   04:30 UTC = 10:00 IST
    #   07:30 UTC = 13:00 IST
    #   10:30 UTC = 16:00 IST
    #   13:30 UTC = 19:00 IST
    #   16:30 UTC = 22:00 IST
    - cron: '30 1,4,7,10,13,16 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no DB writes)'
        required: false
        default: 'false'

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'ingest/requirements.txt'

      - name: Install deps
        run: pip install -r ingest/requirements.txt

      - name: Restore RSS cache
        uses: actions/cache@v4
        with:
          path: ingest/.cache
          key: rss-cache-${{ github.run_id }}
          restore-keys: rss-cache-

      - name: Run ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-lite-latest' }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          INGEST_MAX_STORIES_PER_RUN: '10'
          INGEST_INACTIVE_DAYS: '14'
          INGEST_ARCHIVE_DAYS: '90'
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m ingest.main --dry-run
          else
            python -m ingest.main
          fi

      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-logs-${{ github.run_id }}
          path: ingest/.cache/
          retention-days: 7
          if-no-files-found: ignore
