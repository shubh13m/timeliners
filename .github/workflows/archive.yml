name: Monthly archive

on:
  schedule:
    # 1st of month, 03:00 UTC
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'ingest/requirements.txt'

      - name: Install deps
        run: pip install -r ingest/requirements.txt

      - name: Run archive
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          INGEST_ARCHIVE_DAYS: '90'
        run: python -m ingest.archive

      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/
          if ! git diff --cached --quiet; then
            git commit -m "chore(archive): monthly cold-storage dump"
            git push
          else
            echo "No new archives"
          fi
